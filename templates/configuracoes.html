<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Configurações - ProjectPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { background-color: #1e40af; color: white; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 h-screen flex flex-col items-center pt-10">

    <div class="w-full max-w-6xl bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">

        <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Configurações Gerais</h1>
            <a href="{{ url_for('main.home') }}" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition-colors">Voltar para Home</a>
        </div>

        <!-- Abas de Navegação -->
        <div class="border-b border-gray-200 bg-gray-50">
            <nav class="flex gap-4 px-8 -mb-px">
                <button onclick="switchTab('responsaveis')" class="tab-btn py-4 px-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-gray-300">Responsáveis</button>
                <button onclick="switchTab('times')" class="tab-btn py-4 px-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-gray-300">Times</button>
                <button onclick="switchTab('feriados')" class="tab-btn py-4 px-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-gray-300">Feriados & Bloqueios</button>
            </nav>
        </div>

        <!-- Conteúdo das Abas -->
        <div class="p-8">
            <!-- Aba de Responsáveis -->
            <div id="tab-responsaveis" class="tab-content">
                <!-- ... (código da aba de responsáveis) ... -->
            </div>

            <!-- Aba de Times -->
            <div id="tab-times" class="tab-content">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="md:col-span-1 bg-gray-50 p-6 rounded-xl border border-gray-200">
                        <h2 id="form-title-time" class="font-bold text-lg mb-4 text-slate-800">Adicionar Novo Time</h2>
                        <form id="form-time" action="{{ url_for('main.adicionar_time') }}" method="POST" class="space-y-4">
                            <input type="hidden" name="id" id="time-id">
                            <div>
                                <label for="nome-time" class="block text-sm font-medium text-slate-700">Nome do Time</label>
                                <input type="text" name="nome" id="nome-time" required class="mt-1 w-full input-field">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700">Membros</label>
                                <div id="membros-container" class="mt-2 space-y-2 max-h-60 overflow-y-auto border p-3 rounded-lg bg-white">
                                    {% for r in responsaveis %}
                                    <label class="flex items-center gap-3">
                                        <input type="checkbox" name="membros" value="{{ r.id }}" class="h-4 w-4 rounded text-blue-600 focus:ring-blue-500">
                                        <span>{{ r.nome }}</span>
                                    </label>
                                    {% endfor %}
                                </div>
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button type="submit" id="btn-submit-time" class="btn-primary w-full">Adicionar</button>
                                <button type="button" onclick="resetFormTime()" id="btn-cancel-time" class="btn-secondary w-full hidden">Cancelar</button>
                            </div>
                        </form>
                    </div>
                    <div class="md:col-span-2 bg-white border border-gray-200 rounded-xl overflow-hidden flex flex-col h-[600px]">
                        <div class="bg-gray-100 px-6 py-3 border-b"><span class="font-bold text-slate-700">Times Cadastrados ({{ times|length }})</span></div>
                        <div class="overflow-y-auto flex-1">
                            {% if times %}
                            <table class="w-full text-sm">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 font-semibold text-slate-600 text-left">Nome do Time</th>
                                        <th class="px-6 py-3 font-semibold text-slate-600 text-left">Membros</th>
                                        <th class="px-6 py-3"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    {% for t in times %}
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-6 py-3 font-medium">{{ t.nome }}</td>
                                        <td class="px-6 py-3 text-slate-600 text-xs">
                                            {{ t.membros|join(', ') }}
                                        </td>
                                        <td class="px-6 py-3 text-right">
                                            <button onclick='editTime({{ t|tojson }})' class="font-medium text-blue-600 hover:text-blue-800">Editar</button>
                                            <form action="{{ url_for('main.excluir_time', id=t.id) }}" method="POST" onsubmit="return confirm('Tem certeza?');" class="inline ml-2">
                                                <button type="submit" class="font-medium text-red-600 hover:text-red-800">Excluir</button>
                                            </form>
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                            {% else %}
                            <p class="text-center p-10 text-slate-400">Nenhum time cadastrado.</p>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Aba de Feriados -->
            <div id="tab-feriados" class="tab-content">
                <!-- ... (código da aba de feriados) ... -->
            </div>
        </div>
    </div>

    <script>
        // ... (código javascript existente) ...

        function editTime(time) {
            document.getElementById('form-title-time').innerText = 'Editar Time';
            document.getElementById('time-id').value = time.id;
            document.getElementById('nome-time').value = time.nome;

            document.querySelectorAll('#membros-container input[type="checkbox"]').forEach(cb => cb.checked = false);
            if (time.membros_ids) {
                time.membros_ids.forEach(id => {
                    const cb = document.querySelector(`#membros-container input[value="${id}"]`);
                    if (cb) cb.checked = true;
                });
            }

            document.getElementById('form-time').action = `/times/editar/${time.id}`;
            document.getElementById('btn-submit-time').innerText = 'Salvar Alterações';
            document.getElementById('btn-cancel-time').classList.remove('hidden');
        }

        function resetFormTime() {
            document.getElementById('form-title-time').innerText = 'Adicionar Novo Time';
            document.getElementById('form-time').reset();
            document.getElementById('time-id').value = '';
            document.getElementById('form-time').action = "{{ url_for('main.adicionar_time') }}";
            document.getElementById('btn-submit-time').innerText = 'Adicionar';
            document.getElementById('btn-cancel-time').classList.add('hidden');
        }
    </script>

</body>
</html>
