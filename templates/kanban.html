{% extends 'base.html' %}

{% block head %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='kanban.css') }}">
{% endblock %}

{% block content %}
    <!-- ... (cabeçalho) ... -->

    <div class="flex-1 overflow-hidden p-6 flex flex-col">
        <!-- ... (estatísticas) ... -->

        <div class="kanban-board" id="kanban-board">
            {% for col in colunas %}
            <div class="kanban-column" data-col-id="{{ col.id }}">
                <div class="kanban-column-header">
                    <span>{{ col.nome }}</span>
                    <div class="flex items-center gap-2">
                        <span class="count">{{ cards_por_coluna[col.id]|length }}</span>
                        <button onclick="abrirModalNovaTarefa('{{ col.id }}')" class="btn-add-task" title="Nova Tarefa">+</button>
                    </div>
                </div>
                <div class="kanban-column-body" data-col-id="{{ col.id }}">
                    {% for t in cards_por_coluna[col.id] %}
                    <!-- ... (card da tarefa) ... -->
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- === MODAL NOVA TAREFA === -->
    <dialog id="modal-nova-tarefa" class="modal-config">
        <div class="modal-body">
            <h3 class="font-bold text-lg mb-4">Nova Tarefa</h3>
            <form id="form-nova-tarefa">
                <input type="hidden" id="coluna-id-nova-tarefa">
                <div>
                    <label for="nome-nova-tarefa" class="block text-sm font-medium text-slate-700">Nome da Tarefa</label>
                    <input type="text" id="nome-nova-tarefa" required class="mt-1 w-full input-field">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="document.getElementById('modal-nova-tarefa').close()" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Criar Tarefa</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- ... (outras modais e scripts) ... -->
{% endblock %}
