{% extends 'base.html' %}

{% block content %}
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0 shadow-sm z-10 no-print">
        <div>
            <h1 class="text-lg font-bold text-slate-800">Configurações do Projeto</h1>
            <p class="text-xs text-slate-500">{{ project_id }}</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <a href="{{ url_for('main.cronograma', project_id=project_id) }}" class="flex items-center gap-2 text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-lg text-sm font-medium transition-colors border border-gray-200 whitespace-nowrap">
                Voltar para Cronograma
            </a>
        </div>
    </header>

    <div class="flex-1 overflow-auto p-6">
        <div class="max-w-2xl bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Configurações do Gantt</h2>
            <form method="POST" class="space-y-6">
                <div>
                    <label for="tolerancia_percent" class="block text-sm font-medium text-slate-700 mb-2">
                        Percentual de Tolerância de Atraso (%)
                    </label>
                    <input type="number" name="tolerancia_percent" id="tolerancia_percent" value="{{ config.get('tolerancia_percent', 10) }}" min="0" max="100" class="w-full input-field">
                    <p class="text-xs text-slate-500 mt-1">
                        Se o fim da execução ultrapassar o baseline em mais de X% da duração planejada, a barra será pintada de laranja/vermelho.
                    </p>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="btn-primary">Salvar Configurações</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
