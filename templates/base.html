<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ProjectPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="flex h-screen overflow-hidden bg-gray-50 text-slate-800">

    <aside id="main-sidebar" class="w-64 bg-slate-900 text-white flex flex-col shadow-xl shrink-0 z-50 sidebar-transition relative group">
        
        <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
            <a href="{{ url_for('main.home') }}" class="flex items-center gap-3 overflow-hidden">
                <div class="w-8 h-8 min-w-[2rem] bg-blue-600 rounded-lg flex items-center justify-center font-bold shadow-lg">P</div>
                <span class="font-bold text-lg logo-text fade-text">ProjectPro</span>
            </a>
            
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded-md transition-colors focus:outline-none">
                <svg id="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>

        <nav class="flex-1 p-3 space-y-2 mt-2 overflow-y-auto overflow-x-hidden">
            <a href="{{ url_for('main.home') }}" class="flex items-center gap-3 px-3 py-3 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all" title="Todos Projetos">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="min-w-[20px]"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="fade-text">Todos Projetos</span>
            </a>

            {% if project_id %}
            <div class="my-2 border-t border-slate-800 section-title"></div>
            <div class="px-3 mb-2 section-title">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Projeto Atual</p>
                <p class="text-sm font-bold text-white truncate capitalize">{{ project_id }}</p>
            </div>

            <a href="{{ url_for('main.planilha', project_id=project_id) }}" class="flex items-center gap-3 px-3 py-3 text-sm font-medium rounded-lg transition-all {{ 'bg-blue-600 text-white shadow-md' if page == 'planilha' else 'text-slate-400 hover:bg-slate-800 hover:text-white' }}" title="Planilha">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="min-w-[20px]"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                <span class="fade-text">Planilha</span>
            </a>
            <a href="{{ url_for('main.kanban', project_id=project_id) }}" class="flex items-center gap-3 px-3 py-3 text-sm font-medium rounded-lg transition-all {{ 'bg-blue-600 text-white shadow-md' if page == 'kanban' else 'text-slate-400 hover:bg-slate-800 hover:text-white' }}" title="Kanban">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="min-w-[20px]"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
                <span class="fade-text">Kanban</span>
            </a>
            <a href="{{ url_for('main.cronograma', project_id=project_id) }}" class="flex items-center gap-3 px-3 py-3 text-sm font-medium rounded-lg transition-all {{ 'bg-blue-600 text-white shadow-md' if page == 'cronograma' else 'text-slate-400 hover:bg-slate-800 hover:text-white' }}" title="Cronograma">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="min-w-[20px]"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                <span class="fade-text">Cronograma</span>
            </a>
            {% endif %}
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-gray-50 transition-all">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='base.js') }}"></script>
</body>
</html>
