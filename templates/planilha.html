{% extends 'base.html' %}

{% block head %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='planilha.css') }}">
{% endblock %}

{% block content %}
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0 shadow-sm z-10 no-print">
        <div>
            <h1 class="text-lg font-bold text-slate-800">Planilha de Tarefas</h1>
            <div class="flex items-center gap-4 mt-1">
                <p class="text-xs text-slate-500">As alterações são salvas automaticamente.</p>
                <form action="{{ url_for('main.associar_time_projeto', project_id=project_id) }}" method="POST" class="flex items-center gap-2">
                    <label for="time-select" class="text-xs font-medium text-slate-600">Time:</label>
                    <select name="time_id" id="time-select" onchange="this.form.submit()" class="text-xs border-gray-300 rounded-md shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                        <option value="">Nenhum</option>
                        {% for time in times %}
                        <option value="{{ time.id }}" {% if projeto and projeto.time_id == time.id %}selected{% endif %}>{{ time.nome }}</option>
                        {% endfor %}
                    </select>
                </form>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="{{ url_for('main.exportar_excel', project_id=project_id) }}" class="flex items-center gap-2 text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-lg text-sm font-medium transition-colors border border-gray-200">
                Exportar Excel
            </a>
            <button onclick="window.print()" class="flex items-center gap-2 text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-lg text-sm font-medium transition-colors border border-gray-200">
                Imprimir / PDF
            </button>
            <div class="h-6 w-px bg-gray-300 mx-1"></div>
            <div id="save-status-container" class="flex items-center gap-3">
                <span id="save-status" class="text-xs font-medium text-slate-500 transition-all">Salvo</span>
                <button id="btn-undo" onclick="desfazer()" class="hidden items-center gap-2 bg-gray-200 hover:bg-gray-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                    ↶ Desfazer
                </button>
            </div>
            <button onclick="adicionarLinhaVazia()" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">
                <span>+</span> Nova Linha
            </button>
        </div>
    </header>

    <div class="flex-1 overflow-hidden p-6 flex flex-col">
        <!-- ... (o resto do arquivo permanece o mesmo) ... -->
    </div>

    <script>
        const projectRecalcularUrl = "/projeto/{{ project_id }}/recalcular_rapido";
        const projectSalvarUrl = "{{ url_for('main.salvar_lote', project_id=project_id) }}";
        const initialTasks = {{ tarefas|tojson }};
        const responsaveis = {{ responsaveis|tojson }};
    </script>
    <script src="{{ url_for('static', filename='planilha.js') }}"></script>
{% endblock %}
